# Beads team seed config — bd merges machine-local settings (sync remote,
# repos, etc.) into this file at runtime; only commit team-wide keys.

# Shared issue prefix: same issue ID in every clone is ONE issue.
issue-prefix: 'swing'

# Branch carrying .beads/issues.jsonl for cross-clone interchange.
sync-branch: 'beads-metadata'

# Keep issues.jsonl fresh after writes so the interchange file is current.
export:
  auto: true
